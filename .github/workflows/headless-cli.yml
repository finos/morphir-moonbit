# Experimental diagnostic branch only. This definition is never proposed for main
# and supplies no PR, merge-queue or release qualification.
name: Headless CLI qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: headless-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless:
    name: Native stdout LF prototype (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 3
      - uses: ./.github/actions/setup-moonbit
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
      - name: Probe native stdout binary mode
        timeout-minutes: 10
        env:
          NATIVE_JSON_BINARY_MODE_PROTOTYPE: '1'
        run: node apps/morphir/scripts/test-protocol-json-presentation.ts
      - name: Retain complete raw prototype evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-stdout-lf-prototype-windows-x64-${{ github.sha }}
          path: .dev/native-binary-stdout-prototype/
          include-hidden-files: true
          if-no-files-found: error
