name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl https://mise.run | sh
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/share/mise/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
          mise --version
          mise install
          # Fix permissions for MoonBit binaries (http backend doesn't set +x)
          echo "Fixing MoonBit binary permissions..."
          chmod +x "$HOME/.local/share/mise/installs/http-moonbit"/*/bin/moon* || true
          chmod +x "$HOME/.local/share/mise/installs/http-moonbit"/*/bin/internal/moonrun || true
          ls -la "$HOME/.local/share/mise/installs/http-moonbit"/*/bin/

      - name: Run linting
        run: mise run lint

  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install mise
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl https://mise.run | sh
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/share/mise/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
          mise --version
          mise install
          # Fix permissions for MoonBit binaries (http backend doesn't set +x)
          echo "Fixing MoonBit binary permissions..."
          chmod +x "$HOME/.local/share/mise/installs/http-moonbit"/*/bin/moon* || true
          chmod +x "$HOME/.local/share/mise/installs/http-moonbit"/*/bin/internal/moonrun || true
          ls -la "$HOME/.local/share/mise/installs/http-moonbit"/*/bin/

      - name: Check formatting
        run: mise run lint:moonbit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, format-check]
    strategy:
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update Mooncakes registry
        run: moon update

      - name: Build ${{ matrix.target }}
        run: moon build --target ${{ matrix.target }} --release

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'

      - name: Smoke-test CLI for ${{ matrix.target }}
        run: npm --prefix apps/morphir test -- ${{ matrix.target }}

      - name: Upload ${{ matrix.target }} artifacts
        uses: actions/upload-artifact@v6
        with:
          name: cli-${{ matrix.target }}
          path: |
            _build/${{ matrix.target }}/release/build/morphir/morphir/morphir.*
            apps/morphir/dist/morphir.js
            pkgs/morphir-host/runners/wasm.mjs
          if-no-files-found: error

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint, format-check]
    strategy:
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update Mooncakes registry
        run: moon update

      - name: Run tests
        run: moon test --target ${{ matrix.target }}
